<!doctype html>
<meta charset="utf-8" />
<title>品牌资产预览</title>
<style>
  :root { --ink:#16202c; --muted:#5b6472; --line:#dfe3e9; --bg:#f6f7f9; }

  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { padding: 34px 44px 30px; }
  header { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 20px; padding-top: 24px; }
  .card { flex: 1; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #fff; }
  .stage { height: 190px; display: flex; align-items: center; justify-content: center; }
  .light { background: #f1eee6; }`n  .white { background: #fff; }
  .dark { background: #16202c; }
  .cap { padding: 12px 16px 14px; border-top: 1px solid var(--line); }
  .cap b { display: block; font-size: 13px; }
  .cap span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-family: "IBM Plex Mono", monospace; }
  .note { margin-top: 18px; color: var(--muted); font-size: 11px; line-height: 1.7; }
</style>
