<!doctype html>
<meta charset="utf-8" />
<title>器皿 SVG 预览</title>
<style>
  :root { --ink:#16202c; --muted:#5b6472; --bg:#f6f7f9; --card:#f1eee6; --line:#dfe3e9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { padding: 40px 48px 36px; }
  header { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .02em; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .row { display: flex; align-items: flex-end; justify-content: center; gap: 40px; padding-top: 36px; }
  figure { margin: 0; width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 22px 24px 16px; display: flex; flex-direction: column; align-items: center; }
  .glass { height: 320px; display: flex; align-items: flex-end; }
  .glass img { display: block; }
  figcaption { margin-top: 14px; width: 100%; border-top: 1px dashed var(--line); padding-top: 10px; }
  figcaption b { display: block; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
  figcaption span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-family: "IBM Plex Mono", monospace; }
  .tag { font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-left: auto; font-family: "IBM Plex Mono", monospace; }
</style>
<div class="wrap">
  <header>
    <h1>器皿 SVG 库</h1>
    <p>chem-lab · 统一规范 · 描边 #16202C@70% / 1.4px · 高光 2px white@35% · 刻度 IBM Plex Mono 7px</p>
    <span class="tag">D0 / 3 of N</span>
  </header>
  <div class="row">
    <figure>
      <div class="glass"><img src="../../../public/instruments/burette.svg" alt="酸式滴定管" style="height:320px" /></div>
      <figcaption><b>酸式滴定管</b><span>burette · 50 mL · 0.1 mL</span></figcaption>
    </figure>
    <figure>
      <div class="glass"><img src="../../../public/instruments/conical-flask.svg" alt="锥形瓶" style="height:250px" /></div>
      <figcaption><b>锥形瓶</b><span>conical flask · 250 mL</span></figcaption>
    </figure>
    <figure>
      <div class="glass"><img src="../../../public/instruments/beaker.svg" alt="烧杯" style="height:250px" /></div>
      <figcaption><b>烧杯</b><span>beaker · 250 mL · 10 mL</span></figcaption>
    </figure>
  </div>
</div>
